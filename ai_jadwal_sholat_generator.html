<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Jadwal Sholat Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        /* Spinner Animation */
        .loader {
            border: 4px solid #e5e7eb;
            border-top: 4px solid #165633;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 pb-24">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto p-4 flex items-center gap-3">
            <div class="w-10 h-10 bg-green-700 text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md">
                <i class="ph-fill ph-magic-wand"></i>
            </div>
            <div>
                <h1 class="font-bold text-green-900 leading-tight">AI Poster Generator</h1>
                <p class="text-xs text-gray-500">Masjid Roudlotul Jannah</p>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="flex border-t border-gray-200 max-w-md mx-auto">
            <button id="tab-input" onclick="switchTab('input')" class="flex-1 py-3 text-sm font-semibold text-green-700 border-b-2 border-green-700 bg-green-50 transition-colors">
                1. Input Waktu
            </button>
            <button id="tab-preview" onclick="switchTab('preview')" class="flex-1 py-3 text-sm font-semibold text-gray-500 border-b-2 border-transparent hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
                2. Generate AI
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 mt-2">
        <!-- INPUT SECTION -->
        <section id="section-input" class="space-y-6 block">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-2">
                    <i class="ph-fill ph-calendar-blank text-green-600 text-lg"></i> Tanggal Poster
                </h2>
                <div>
                    <input type="date" id="input-date" onchange="handleDateChange(this.value)"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-green-600 focus:outline-none transition-all">
                    <button onclick="setToday()" class="mt-2 text-xs text-green-600 font-semibold hover:underline flex items-center gap-1">
                        <i class="ph-bold ph-arrow-counter-clockwise"></i> Gunakan Hari Ini
                    </button>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-2">
                    <i class="ph-fill ph-clock text-green-600 text-lg"></i> Waktu Sholat
                </h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <!-- Imsak -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">IMSAK</label>
                        <input type="time" id="input-imsak" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold focus:ring-2 focus:ring-green-600 focus:outline-none transition-all">
                    </div>
                    <!-- Shubuh -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">SHUBUH</label>
                        <input type="time" id="input-shubuh" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold focus:ring-2 focus:ring-green-600 focus:outline-none transition-all">
                    </div>
                    <!-- Dhuha -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">DHUHA</label>
                        <input type="time" id="input-dhuha" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold focus:ring-2 focus:ring-green-600 focus:outline-none transition-all">
                    </div>
                    <!-- Zuhur -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">ZUHUR</label>
                        <input type="time" id="input-zuhur" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold focus:ring-2 focus:ring-green-600 focus:outline-none transition-all">
                    </div>
                    <!-- Ashar -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">ASHAR</label>
                        <input type="time" id="input-ashar" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold focus:ring-2 focus:ring-green-600 focus:outline-none transition-all">
                    </div>
                    <!-- Maghrib -->
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">MAGHRIB</label>
                        <input type="time" id="input-maghrib" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold focus:ring-2 focus:ring-green-600 focus:outline-none transition-all">
                    </div>
                    <!-- Isya -->
                    <div class="col-span-2">
                        <label class="block text-xs font-bold text-gray-500 mb-1">ISYA'</label>
                        <input type="time" id="input-isya" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold focus:ring-2 focus:ring-green-600 focus:outline-none transition-all">
                    </div>
                </div>

                <div class="mt-6 flex justify-end">
                    <button onclick="switchTab('preview')" class="bg-green-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-green-700/30 hover:bg-green-800 active:scale-95 transition-all w-full flex items-center justify-center gap-2">
                        Lanjut ke AI Generator <i class="ph-bold ph-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- PREVIEW SECTION -->
        <section id="section-preview" class="hidden space-y-4">
            
            <button id="btn-generate-ai" onclick="generateImageWithAI()" class="w-full bg-gradient-to-r from-green-600 to-green-800 text-white p-4 rounded-2xl font-bold shadow-lg shadow-green-700/40 hover:opacity-90 active:scale-95 transition-all flex flex-col items-center justify-center gap-2">
                <div class="flex items-center gap-2 text-lg">
                    <i class="ph-fill ph-magic-wand"></i> Mulai Gambar dengan AI
                </div>
                <span class="text-xs font-normal opacity-80 text-center">AI akan membaca jadwal Anda & melukis poster 3:4. Butuh waktu ~15 detik.</span>
            </button>

            <!-- Loading State -->
            <div id="ai-loading" class="hidden flex-col items-center justify-center p-12 bg-white rounded-2xl border border-dashed border-gray-300">
                <div class="loader mb-4"></div>
                <h3 class="font-bold text-gray-700">AI Sedang Melukis...</h3>
                <p class="text-sm text-gray-500 text-center mt-2">Menyusun palet warna hijau emas dan merangkai teks jadwal sholat.</p>
            </div>

            <!-- Result State -->
            <div id="ai-result-container" class="hidden flex-col gap-4">
                <div class="bg-green-50 text-green-800 p-3 rounded-xl text-xs font-medium border border-green-200 flex gap-2 items-start">
                    <i class="ph-fill ph-check-circle text-lg shrink-0"></i>
                    <p>Poster berhasil digenerate! AI mungkin sesekali memiliki variasi teks, periksa sebelum diunduh.</p>
                </div>
                
                <!-- Display Image -->
                <div class="w-full rounded-2xl overflow-hidden shadow-lg border border-gray-200 bg-white">
                    <img id="generated-image" src="" alt="Jadwal Sholat" class="w-full h-auto object-cover aspect-[3/4]">
                </div>

                <button onclick="downloadImage()" class="w-full bg-gray-900 text-white p-4 rounded-xl font-bold shadow-lg hover:bg-black active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i class="ph-bold ph-download-simple text-xl"></i> Simpan ke Galeri
                </button>
            </div>

        </section>
    </main>

                {"tanggal": "2026-12-28", "imsak": "03:43", "subuh": "03:53", "dhuha": "05:43", "dhuhur": "11:35", "ashar": "15:02", "maghrib": "17:51", "isya": "19:07"},
                {"tanggal": "2026-12-29", "imsak": "03:44", "subuh": "03:54", "dhuha": "05:44", "dhuhur": "11:35", "ashar": "15:02", "maghrib": "17:51", "isya": "19:07"},
                {"tanggal": "2026-12-30", "imsak": "03:44", "subuh": "03:54", "dhuha": "05:44", "dhuhur": "11:35", "ashar": "15:03", "maghrib": "17:52", "isya": "19:07"},

              ]
            }
          ]
        };

        const jadwalMap = {};
        if (rawJadwalData.jadwal) {
            rawJadwalData.jadwal.forEach(bulan => {
                bulan.data.forEach(hari => {
                    jadwalMap[hari.tanggal] = hari;
                });
            });
        }

        // State Management
        const STORAGE_KEY = 'jadwal_sholat_ai_data';
        const fields = ['imsak', 'shubuh', 'dhuha', 'zuhur', 'ashar', 'maghrib', 'isya'];
        let currentImageUrl = '';

        // Tab Switching
        function switchTab(tab) {
            saveData(); // Save inputs whenever switching tabs
            
            const sectionInput = document.getElementById('section-input');
            const sectionPreview = document.getElementById('section-preview');
            const tabInput = document.getElementById('tab-input');
            const tabPreview = document.getElementById('tab-preview');

            if (tab === 'input') {
                sectionInput.classList.remove('hidden');
                sectionPreview.classList.add('hidden');
                tabInput.className = "flex-1 py-3 text-sm font-semibold text-green-700 border-b-2 border-green-700 bg-green-50 transition-colors";
                tabPreview.className = "flex-1 py-3 text-sm font-semibold text-gray-500 border-b-2 border-transparent hover:bg-gray-50 transition-colors flex items-center justify-center gap-2";
            } else {
                sectionInput.classList.add('hidden');
                sectionPreview.classList.remove('hidden');
                tabPreview.className = "flex-1 py-3 text-sm font-semibold text-green-700 border-b-2 border-green-700 bg-green-50 transition-colors flex items-center justify-center gap-2";
                tabInput.className = "flex-1 py-3 text-sm font-semibold text-gray-500 border-b-2 border-transparent hover:bg-gray-50 transition-colors";
                
                // Jika baru masuk tab preview dan belum ada gambar, reset state
                if(!currentImageUrl) {
                    document.getElementById('btn-generate-ai').classList.remove('hidden');
                    document.getElementById('ai-loading').classList.add('hidden');
                    document.getElementById('ai-result-container').classList.add('hidden');
                }
            }
        }

        function handleDateChange(dateStr) {
            const timeData = jadwalMap[dateStr];
            if (timeData) {
                document.getElementById('input-imsak').value = timeData.imsak;
                document.getElementById('input-shubuh').value = timeData.subuh;
                document.getElementById('input-dhuha').value = timeData.dhuha;
                document.getElementById('input-zuhur').value = timeData.dhuhur;
                document.getElementById('input-ashar').value = timeData.ashar;
                document.getElementById('input-maghrib').value = timeData.maghrib;
                document.getElementById('input-isya').value = timeData.isya;
            }
        }

        // Tanggal Hari Ini
        function setToday() {
            const today = new Date();
            // Data kita tahun 2026, jika dibuka tahun lain, kita set ke 2026 untuk demo
            if (today.getFullYear() !== 2026) today.setFullYear(2026);
            
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const formatted = `${yyyy}-${mm}-${dd}`;
            
            document.getElementById('input-date').value = formatted;
            handleDateChange(formatted);
        }

        function formatDateIndo(dateStr) {
            if(!dateStr) return "Hari Ini";
            const d = new Date(dateStr);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return d.toLocaleDateString('id-ID', options);
        }

        // Save & Load Data dari Local Storage
        function saveData() {
            const dataToSave = { date: document.getElementById('input-date').value };
            fields.forEach(f => dataToSave[f] = document.getElementById(`input-${f}`).value);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
        }

        function loadData() {
            const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY));
            
            // Default waktu sholat (Agar user tinggal geser menit)
            const defaultTimes = {
                imsak: '04:00',
                shubuh: '04:10',
                dhuha: '05:45',
                zuhur: '11:45',
                ashar: '15:00',
                maghrib: '17:40',
                isya: '18:55'
            };

            if (savedData) {
                if (savedData.date) document.getElementById('input-date').value = savedData.date;
                fields.forEach(f => {
                    document.getElementById(`input-${f}`).value = savedData[f] || defaultTimes[f];
                });
            } else {
                setToday();
                fields.forEach(f => {
                    document.getElementById(`input-${f}`).value = defaultTimes[f];
                });
            }
        }

        // AI Image Generation Logic (Gemini 3.1 Flash Image Preview)
        async function generateImageWithAI() {
            saveData(); // Make sure data is saved

            // Ambil data
            const dateValRaw = document.getElementById('input-date').value;
            const dateVal = dateValRaw ? formatDateIndo(dateValRaw) : "Hari Ini";
            const imsak = document.getElementById('input-imsak').value || "-";
            const shubuh = document.getElementById('input-shubuh').value || "-";
            const dhuha = document.getElementById('input-dhuha').value || "-";
            const zuhur = document.getElementById('input-zuhur').value || "-";
            const ashar = document.getElementById('input-ashar').value || "-";
            const maghrib = document.getElementById('input-maghrib').value || "-";
            const isya = document.getElementById('input-isya').value || "-";

            // Prompt super spesifik agar AI fokus pada teks yang akurat
            const prompt = `Create a clean, highly legible Islamic prayer schedule poster based on image_0.png. 
Color palette: Deep green background with golden accents and Islamic geometric patterns.
Top Header: Small elegant gold text "Masjid Roudlotul Jannah" and right below it "Perumnas Tasikmadu - Palang".
Main Title: Below header, large gold letters: "JADWAL SHOLAT".
Below the title, text in white: "${dateVal}".
In the middle, a large readable gold card with a dark green background for each row, containing exactly this text line by line, clearly spelled:
IMSAK ${imsak} WIB
SHUBUH ${shubuh} WIB
DHUHA ${dhuha} WIB
ZUHUR ${zuhur} WIB
ASHAR ${ashar} WIB
MAGHRIB ${maghrib} WIB
ISYA' ${isya} WIB

Bottom Footer:
Bottom left corner: simple white icons for facebook, instagram, tiktok followed by text "Masjid Roudlotul Jannah Tasikmadu".
Bottom right corner: simple white globe website icon followed by text "masjidroudlotuljannah.org".
Visual style: Minimalist geometric Islamic patterns, silhouette of a mosque dome, glowing lanterns, ultra-sharp typography. Ensure all the time numbers are perfectly legible and correctly spelled exactly as provided. Aspect ratio must be vertical 3:4.`;

            // UI Changes
            document.getElementById('btn-generate-ai').classList.add('hidden');
            document.getElementById('ai-result-container').classList.add('hidden');
            document.getElementById('ai-loading').classList.remove('hidden');
            document.getElementById('ai-loading').classList.add('flex');

            try {
                // API Call ke Gemini 3.1 Flash Image (Nano Banana)
                const payload = {
                    contents: [{
                        role: 'user',
                        parts: [{ text: prompt }]
                    }],
                    generationConfig: {
                        responseModalities: ['IMAGE'],
                        imageConfig: { aspectRatio: "3:4" }
                    },
                };

                const apiKey = ""; // Canvas otomatis menyuntikkan API key jika string kosong
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image-preview:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                // Ekstraksi Base64 Gambar dari response
                const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                
                if (part && part.inlineData && part.inlineData.data) {
                    const imageUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                    currentImageUrl = imageUrl;
                    
                    // Tampilkan Gambar
                    document.getElementById('generated-image').src = imageUrl;
                    document.getElementById('ai-loading').classList.add('hidden');
                    document.getElementById('ai-loading').classList.remove('flex');
                    document.getElementById('ai-result-container').classList.remove('hidden');
                    document.getElementById('ai-result-container').classList.add('flex');
                    
                    // Kembalikan tombol generate untuk redraw
                    const btnGen = document.getElementById('btn-generate-ai');
                    btnGen.classList.remove('hidden');
                    btnGen.innerHTML = '<i class="ph-bold ph-arrows-clockwise"></i> Generate Ulang (Desain Lain)';
                    btnGen.className = "w-full bg-white text-green-700 border-2 border-green-700 p-3 rounded-xl font-bold hover:bg-green-50 active:scale-95 transition-all flex items-center justify-center gap-2 mt-4";
                    
                } else {
                    throw new Error("Format response dari AI tidak terduga atau gambar gagal di-generate.");
                }

            } catch (error) {
                console.error("Generate error:", error);
                
                // Reset UI dan tampilkan error
                document.getElementById('ai-loading').classList.add('hidden');
                document.getElementById('ai-loading').classList.remove('flex');
                
                const btnGen = document.getElementById('btn-generate-ai');
                btnGen.classList.remove('hidden');
                btnGen.innerHTML = '<i class="ph-bold ph-warning-circle"></i> Gagal, Coba Generate Lagi';
                btnGen.className = "w-full bg-red-600 text-white p-4 rounded-2xl font-bold shadow-lg hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2";
            }
        }

        // Logic Download Gambar Asli
        function downloadImage() {
            if (!currentImageUrl) return;
            
            const rawDate = document.getElementById('input-date').value || 'Hari_Ini';
            const safeName = rawDate.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            
            const link = document.createElement('a');
            link.download = `Jadwal_Roudlotul_Jannah_${safeName}.jpg`;
            link.href = currentImageUrl;
            link.click();
        }

        // Init
        window.onload = loadData;
    </script>
